name: CI

on:
  pull_request:
  push:
    branches: [dev, test, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: construct-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit, headers, pin, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund

      # The SDK pin must be exact and match the branch's tier: on a PR the base
      # branch decides (a dev -> test promotion is judged by test's rule).
      - run: node scripts/ci/check-sdk-pin.mjs

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:headers
      # No VITE_APP_ID: the build must succeed for a clone with no env file at
      # all, because that is what a third party gets.
      - run: npm run build

  browser:
    name: Browser smoke (isolation headers, sign-in screen)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # The live half of the suite skips itself without credentials; this job
      # proves the served bundle is cross-origin isolated and boots.
      - run: npm run test:e2e
