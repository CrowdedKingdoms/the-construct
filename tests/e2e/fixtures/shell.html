<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>shell fixture</title>
    <style>
      html,
      body,
      iframe {
        margin: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- A stand-in for Crowdy-Games shell/ (protocol v1): hello on load and on request,
         record every navigate request instead of performing it. -->
    <pre id="log"></pre>
    <iframe
      id="game"
      title="game"
      sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-modals"
      allow="camera *; microphone *; cross-origin-isolated *"
    ></iframe>
    <script type="module" src="./shell.js"></script>
  </body>
</html>
